[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/p2p",
  "crates/server",
  "app/src-tauri",
  "plugins/fgservice",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["SpiderNotes"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
dirs = "6"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
