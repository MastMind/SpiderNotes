name: ci

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-cargo-

      - name: Test
        # core + p2p + server carry the sync/relay logic; the app crate
        # needs GTK system libraries to build, which the per-OS build jobs
        # provide
        run: cargo test -p spidernotes-core -p spidernotes-p2p -p spidernotes-server

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # pinned: ubuntu-latest is now 26.04 (resolute); the aarch64 cross
          # recipe and webkit stack are verified on 24.04 (noble)
          - os: ubuntu-24.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            cross: ""
          # cross-compiled: needs the target-arch webkit2gtk/gtk stack
          # (multiarch debs) + a cross linker; deb only (the AppImage
          # bundler downloads host-arch runtime files). No i686 entry:
          # Ubuntu has no i386 builds of libxdo3 / libayatana-appindicator3,
          # which Tauri links against unconditionally
          - os: ubuntu-24.04
            name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            bundles: deb
            cross: aarch64
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            cross: ""
          # no system libs needed on Windows (WebView2 is fetched at
          # runtime); the x86 MSVC toolchain ships with the runner
          - os: windows-latest
            name: windows-i686
            target: i686-pc-windows-msvc
            bundles: msi,nsis
            cross: ""
          # NSIS only for now: the x86 installer runs on ARM64 under
          # emulation; the MSI (WiX) ARM64 path is unverified
          - os: windows-latest
            name: windows-aarch64
            target: aarch64-pc-windows-msvc
            bundles: nsis
            cross: ""
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            bundles: app,dmg
            cross: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both Apple arches installed
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin x86_64-apple-darwin' || matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      # Linux-only system dependencies for Tauri (webkit2gtk-4.1 and friends)
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          # runner's package lists are often stale (404s); wipe and re-download, retry once
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists
          sudo apt-get update || sudo apt-get update
          if [ -z "${{ matrix.cross }}" ]; then
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev build-essential curl wget file \
              libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          else
            # arm64 debs live in the ports archive; the main archive lists
            # arm64 in its Release index but 404s the index files, so split
            # the sources by arch (main: amd64, ports: arm64)
            sudo bash -c 'printf "Types: deb\nURIs: http://archive.ubuntu.com/ubuntu/\nSuites: noble noble-updates noble-backports noble-security\nComponents: main universe\nArchitectures: amd64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n" > /etc/apt/sources.list.d/main.sources'
            sudo bash -c 'printf "Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-backports\nComponents: main universe\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n" > /etc/apt/sources.list.d/ports-arm64.sources'
            sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            # native python3 + qemu satisfy libglib2.0-dev:arm64's
            # "python3 | qemu-user | qemu-user-static" and "python3:any" deps;
            # otherwise apt pulls an arm64 python whose postinst cannot run
            # on x86 (Exec format error)
            sudo apt-get install -y --no-install-recommends \
              build-essential curl wget file pkg-config python3 qemu-user-static \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
              libwebkit2gtk-4.1-dev:arm64 libxdo-dev:arm64 libssl-dev:arm64 \
              libayatana-appindicator3-dev:arm64 librsvg2-dev:arm64
            # fail loudly with diagnostics if the cross stack is missing
            if [ ! -f /usr/lib/aarch64-linux-gnu/pkgconfig/glib-2.0.pc ]; then
              echo "::error::arm64 webkit/glib dev stack missing"
              dpkg --print-foreign-architectures
              apt-cache policy libglib2.0-dev:arm64 | head -5
              dpkg -l | grep arm64 | head -20
              find /usr -name "glib-2.0.pc" 2>/dev/null | head
              exit 1
            fi
          fi

      # cross env for the linux targets: point pkg-config and the C
      # compiler at the target-arch multiarch directories
      - if: matrix.os == 'ubuntu-24.04' && matrix.cross != ''
        shell: bash
        run: |
          TRIPLET=aarch64-linux-gnu; TUP=AARCH64_UNKNOWN_LINUX_GNU
          echo "PKG_CONFIG_PATH=/usr/lib/${TRIPLET}/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "CC_${TUP}=${TRIPLET}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${TUP}=${TRIPLET}-g++" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TUP}_LINKER=${TRIPLET}-gcc" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # The restored target/ cache may hold bundles of an OLDER build: the
      # tauri bundler does not clean its output dir, so the `*.deb` / `*.exe`
      # / `*.dmg` globs in "Stage artifacts" would match stale + fresh files
      # at once and `cp` fails with "target ...: No such file or directory".
      # Wipe the bundle dir so staging always sees exactly the fresh set.
      - name: Clean stale bundles
        shell: bash
        run: rm -rf "target/${{ matrix.target }}/release/bundle"

      - name: Build
        working-directory: app
        env:
          # baked into the frontend as __BUILD_SHA__ (visible in the top bar)
          CI_SHA: ${{ github.sha }}
        # explicit --target for every matrix entry (macos: universal =
        # one fat binary, x86_64 + arm64); output lands in
        # target/<target>/release/bundle
        # bash everywhere: the default shell on windows runners is
        # PowerShell, where `set -x` does not exist
        shell: bash
        run: |
          set -x
          pnpm tauri build -v --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      # The release job flattens all artifacts into one directory, so give
      # every artifact an explicit os-arch name to avoid collisions.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          SRC="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              cp "$SRC"/deb/*.deb "out/spidernotes-${{ matrix.name }}.deb"
              if ls "$SRC"/appimage/*.AppImage >/dev/null 2>&1; then
                cp "$SRC"/appimage/*.AppImage "out/spidernotes-${{ matrix.name }}.AppImage"
              fi
              ;;
            windows-latest)
              cp "$SRC"/nsis/*.exe "out/spidernotes-${{ matrix.name }}-setup.exe"
              if ls "$SRC"/msi/*.msi >/dev/null 2>&1; then
                cp "$SRC"/msi/*.msi "out/spidernotes-${{ matrix.name }}.msi"
              fi
              ;;
            macos-latest)
              cp "$SRC"/dmg/*.dmg "out/spidernotes-${{ matrix.name }}.dmg"
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: spidernotes-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Relay server (spidernotes-server): an optional sync "middleman" for when
  # mDNS cannot discover peers. It runs on always-on machines — Linux only
  # (home server / Raspberry Pi / VPS), no desktop targets.
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            name: linux-aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: server-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            server-${{ matrix.os }}-cargo-

      # cross toolchain for the linux aarch64 target. libc6-dev-arm64-cross
      # supplies the libc startup objects (Scrt1.o / crti.o / crtn.o) that
      # gcc-aarch64-linux-gnu alone does not install on the runner.
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p spidernotes-server

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/spidernotes-server" \
             "out/spidernotes-server-${{ matrix.name }}"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: spidernotes-server-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # all four Android ABIs: the universal APK bundles every one of them
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            android-cargo-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # space-separated: the action splits on spaces only
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;29.0.13846066

      # the gradle "rust" plugin (gen/android/buildSrc) shells out to `cargo-tauri`
      # from PATH; install the prebuilt binary matching @tauri-apps/cli (2.12.5)
      - name: Install cargo-tauri (prebuilt)
        run: |
          curl -sL https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.5/cargo-tauri-x86_64-unknown-linux-gnu.tgz | tar xz -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo-tauri --version

      # Decode the release signing key from secrets so the APK is installable.
      # Requires repo secrets SPIDERNOTES_KEYSTORE_BASE64 + SPIDERNOTES_KEYSTORE_PASSWORD.
      # If they are missing we do NOT fail the build: we warn and produce an
      # unsigned APK (still inspectable) so the pipeline stays green.
      - name: Decode release keystore (signing)
        env:
          KEYSTORE_B64: ${{ secrets.SPIDERNOTES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPIDERNOTES_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::SPIDERNOTES_KEYSTORE_BASE64 / SPIDERNOTES_KEYSTORE_PASSWORD are not set."
            echo "==> Building an UNSIGNED APK (may be refused on Android 11+)."
            echo "To get a signed, installable APK add these two repo secrets"
            echo "(Settings > Secrets and variables > Actions > New repository secret):"
            echo "  SPIDERNOTES_KEYSTORE_BASE64   = contents of app/src-tauri/keystore/SPIDERNOTES_KEYSTORE_BASE64.txt"
            echo "  SPIDERNOTES_KEYSTORE_PASSWORD = the keystore password"
            exit 0
          fi
          # strip ALL whitespace (pasted secrets often carry stray newlines/CR)
          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          echo "keystore base64 length: ${#CLEAN_B64} (expected 3672)"
          echo "keystore base64 sha256: $(printf '%s' "$CLEAN_B64" | sha256sum | cut -d' ' -f1)"
          echo "expected sha256:        516e82a268b0a06a06874d5c06655a38cfa466e8659ad4dbff6d8df2caaf249d"
          mkdir -p app/src-tauri/keystore
          if ! printf '%s' "$CLEAN_B64" | base64 -d > app/src-tauri/keystore/spidernotes-release.keystore 2>/dev/null; then
            echo "::error::SPIDERNOTES_KEYSTORE_BASE64 is not valid base64."
            echo "Re-copy the FULL contents of app/src-tauri/keystore/SPIDERNOTES_KEYSTORE_BASE64.txt"
            echo "(3672 chars, one line, no line numbers / extra characters) into the secret."
            exit 1
          fi
          if ! keytool -list -keystore app/src-tauri/keystore/spidernotes-release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded file is not a valid keystore, or SPIDERNOTES_KEYSTORE_PASSWORD is wrong."
            echo "If the sha256 above differs from the expected one, the secret is truncated/corrupted — re-paste it."
            exit 1
          fi
          ls -l app/src-tauri/keystore/spidernotes-release.keystore

      - name: Build APK (universal, all ABIs)
        working-directory: app
        env:
          # consumed by gen/android/app/build.gradle.kts to sign the release APK
          SPIDERNOTES_KEYSTORE_PASSWORD: ${{ secrets.SPIDERNOTES_KEYSTORE_PASSWORD }}
          # baked into the frontend as __BUILD_SHA__ (visible in the top bar)
          CI_SHA: ${{ github.sha }}
        # no --target => Tauri builds the "universal" variant (all ABIs in one APK)
        run: pnpm tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: spidernotes-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: [build, android, server]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Diagnose the actual layout (artifact entry paths depend on the
      # upload patterns) and flatten everything into one directory so the
      # release gets clean asset names. Fails loudly on zero files instead
      # of publishing an empty release.
      - name: Stage artifacts for upload
        run: |
          echo "=== downloaded artifact layout ==="
          find artifacts -type f -printf '%p  (%s bytes)\n' | sort
          mkdir -p upload
          find artifacts -type f -exec cp -n {} upload/ \;
          echo "=== files to publish ==="
          ls -la upload
          count=$(find upload -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No artifact files found — not publishing an empty release"
            exit 1
          fi
          echo "will publish $count file(s)"

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: false
          prerelease: true
          body: |
            **Alpha release.** Local-first Markdown notes with P2P sync over
            your home network — no cloud.

            Artifacts:
            - Linux: `.deb` (x86_64 / aarch64), `.AppImage` (x86_64)
            - Windows: `.msi` + Setup `.exe` (x86_64 / i686), Setup `.exe` (aarch64)
            - macOS: `.dmg` (universal: Intel + Apple Silicon)
            - Android: universal `.apk` (all ABIs)
            - `spidernotes-server-*`: optional relay server (see below)

            First run: point the app at a vault folder (empty = default
            path). To sync two devices: open **Network & log** (gear) on each,
            find the other device, press **Trust**, compare the device IDs,
            then **Sync with all trusted**.

            **Syncing across subnets / NAT (relay server).** When mDNS cannot
            discover devices (different networks, VPN), run `spidernotes-server`
            on any always-on machine:
            `spidernotes-server --host 0.0.0.0 --port 8788 --secret "…"`
            Then in each app: **Network & log → Server sync**, enter the host,
            port, a room name and the server secret. Devices that pick the same
            room name see each other and sync through the server (rooms are
            created on first join, deleted when empty); the sync itself stays
            end-to-end encrypted (the server only relays ciphertext and never
            sees note contents). Inspect the server with
            `nc 127.0.0.1 8789` (rooms / members / stats). mDNS keeps working
            in parallel — direct connections always take priority.

            This is an alpha — expect rough edges. Back up your vault.
